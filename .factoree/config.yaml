# Factoree reads this file through its GitHub App.
version: 1
identity:
  product: factoree-test
  linear:
    teamKey: FAC
# A Fly Sprite has no opencode, so the bootstrap installs it from npm into the user's home, which is
# on the PATH. npm 12 runs no install script, so the bootstrap runs the postinstall that links the
# binary. The Factoree sandbox image on Kiln already holds opencode, so the install is skipped there.
bootstrap:
  command: 'if ! command -v opencode >/dev/null; then npm install -g --prefix "$HOME/.local" opencode-ai && cd "$HOME/.local/lib/node_modules/opencode-ai" && node postinstall.mjs; fi'
verify:
  commands:
    - name: tree-clean
      run: git diff --check HEAD
agents:
  implementer: opencode
  validator: opencode
  reviewer: opencode
sandbox:
  allowedDomains:
    - registry.npmjs.org
    - opencode.ai
    - models.dev
    - api.deepseek.com
