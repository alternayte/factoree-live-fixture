# Factoree reads this file through its GitHub App.
version: 1
identity:
  product: factoree-test
  linear:
    teamKey: FAC
# The sprite has no opencode. The bootstrap installs it from npm into a directory on the sprite PATH.
bootstrap:
  command: npm install -g --prefix /home/sprite/.local opencode-ai
verify:
  commands:
    - name: tree-clean
      run: git diff --check HEAD
agents:
  implementer: opencode
  validator: opencode
  reviewer: opencode
sandbox:
  allowedDomains:
    - registry.npmjs.org
    - opencode.ai
    - models.dev
